<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 700" width="520" height="700" role="img">
  <title>Layered Volatility Decomposition — book</title>
  <desc>A drawn cover of the book Layered Volatility Decomposition: Software Architecture in the Age of AI, by Anup Hariharan Nair.</desc>
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1a38"/>
      <stop offset="0.5" stop-color="#071023"/>
      <stop offset="1" stop-color="#030810"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#02060e"/>
      <stop offset="1" stop-color="#0a1529"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4b4f"/><stop offset="0.33" stop-color="#e08a3a"/>
      <stop offset="0.66" stop-color="#3fb868"/><stop offset="1" stop-color="#3b8bde"/>
    </linearGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <style>
    .serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif; }
    .sans  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    @keyframes float   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes shadowB { 0%,100% { opacity: 0.45; } 50% { opacity: 0.28; } }
    @keyframes shimmer { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
    .float   { animation: float 9s ease-in-out infinite; }
    .shadow  { animation: shadowB 9s ease-in-out infinite; }
    .shim    { animation: shimmer 6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- ground shadow -->
  <ellipse class="shadow" cx="262" cy="648" rx="175" ry="20" fill="#000000" opacity="0.45" filter="url(#soft)"/>

  <g class="float">
    <!-- page block -->
    <rect x="414" y="74" width="16" height="526" fill="#d8d2c4"/>
    <path d="M416 86h12M416 118h12M416 150h12M416 182h12M416 214h12M416 246h12M416 278h12M416 310h12M416 342h12M416 374h12M416 406h12M416 438h12M416 470h12M416 502h12M416 534h12M416 566h12" stroke="#b4ad9c" stroke-width="1.4"/>
    <!-- spine -->
    <rect x="72" y="64" width="26" height="546" fill="url(#spine)"/>
    <!-- front cover -->
    <rect x="98" y="58" width="322" height="552" rx="7" fill="url(#cover)" stroke="#27406f" stroke-width="1.6"/>

    <!-- mini layer stack, volatile (red) on top -->
    <g>
      <text class="sans" x="259" y="102" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="4" fill="#8fa8d8">V O L A T I L I T Y</text>
      <rect class="shim" x="152" y="116" width="214" height="15" rx="4" fill="#6e1c22" stroke="#ef4b4f" stroke-opacity="0.85" style="animation-delay:0s"/>
      <rect class="shim" x="152" y="136" width="214" height="15" rx="4" fill="#5e3214" stroke="#e08a3a" stroke-opacity="0.8" style="animation-delay:-0.7s"/>
      <rect class="shim" x="152" y="156" width="214" height="15" rx="4" fill="#4e4310" stroke="#c4b13a" stroke-opacity="0.75" style="animation-delay:-1.4s"/>
      <rect class="shim" x="152" y="176" width="214" height="15" rx="4" fill="#094330" stroke="#3fb868" stroke-opacity="0.7" style="animation-delay:-2.1s"/>
      <rect class="shim" x="152" y="196" width="214" height="15" rx="4" fill="#053b41" stroke="#26b5a0" stroke-opacity="0.65" style="animation-delay:-2.8s"/>
      <rect class="shim" x="152" y="216" width="214" height="15" rx="4" fill="#0b3a5d" stroke="#2fa0c9" stroke-opacity="0.6" style="animation-delay:-3.5s"/>
      <rect class="shim" x="152" y="236" width="214" height="15" rx="4" fill="#0d3160" stroke="#3b8bde" stroke-opacity="0.55" style="animation-delay:-4.2s"/>
      <rect class="shim" x="152" y="256" width="214" height="15" rx="4" fill="#0b2a55" stroke="#3a6fd8" stroke-opacity="0.5" style="animation-delay:-4.9s"/>
    </g>

    <!-- title block -->
    <text class="serif" x="122" y="372" font-size="36" font-weight="700" fill="#ede8de">Layered</text>
    <text class="serif" x="122" y="416" font-size="36" font-weight="700" fill="#ede8de">Volatility</text>
    <text class="serif" x="122" y="460" font-size="36" font-weight="700" fill="#ede8de">Decomposition</text>
    <rect x="122" y="482" width="46" height="4" rx="2" fill="url(#rainbow)"/>
    <text class="sans" x="122" y="514" font-size="17" font-weight="700" letter-spacing="2.4" fill="#b8c6e4">SOFTWARE ARCHITECTURE</text>
    <text class="sans" x="122" y="537" font-size="17" font-weight="700" letter-spacing="2.4" fill="#b8c6e4">IN THE AGE OF <tspan fill="#ef7a7d">AI</tspan></text>
    <text class="sans" x="122" y="583" font-size="14" font-weight="600" letter-spacing="3" fill="#8fa8d8">ANUP HARIHARAN NAIR</text>

    <!-- rainbow foot of the cover -->
    <rect x="98" y="600" width="322" height="5" fill="url(#rainbow)"/>
  </g>
</svg>
