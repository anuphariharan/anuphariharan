<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img">
  <title>Anup Hariharan Nair</title>
  <desc>Software architect and author of Layered Volatility Decomposition. Distributed systems, performance, reliability.</desc>
  <defs>
    <radialGradient id="glow" cx="30%" cy="35%" r="85%">
      <stop offset="0%" stop-color="#142a55"/>
      <stop offset="55%" stop-color="#081225"/>
      <stop offset="100%" stop-color="#02060e"/>
    </radialGradient>
    <pattern id="hex" width="56" height="97" patternUnits="userSpaceOnUse" patternTransform="translate(8 4)">
      <path d="M28 0l28 16.2v32.3L28 64.7 0 48.5V16.2zM28 64.7l28 16.2v32.3M28 64.7L0 80.9v32.3"
            fill="none" stroke="#1b335f" stroke-opacity="0.22" stroke-width="1"/>
    </pattern>
    <!-- two full colour cycles so a half-width translate loops seamlessly -->
    <linearGradient id="rainbowFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4b4f"/><stop offset="0.125" stop-color="#e08a3a"/>
      <stop offset="0.25" stop-color="#3fb868"/><stop offset="0.375" stop-color="#3b8bde"/>
      <stop offset="0.5" stop-color="#ef4b4f"/><stop offset="0.625" stop-color="#e08a3a"/>
      <stop offset="0.75" stop-color="#3fb868"/><stop offset="0.875" stop-color="#3b8bde"/>
      <stop offset="1" stop-color="#ef4b4f"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4b4f"/><stop offset="0.33" stop-color="#e08a3a"/>
      <stop offset="0.66" stop-color="#3fb868"/><stop offset="1" stop-color="#3b8bde"/>
    </linearGradient>
    <linearGradient id="vbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef4b4f"/><stop offset="0.5" stop-color="#e08a3a"/><stop offset="1" stop-color="#3b8bde"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="ruleClip"><rect x="18" y="292" width="1244" height="4" rx="2"/></clipPath>
    <!-- wipe mask for the subtitle: full width when animation is unsupported -->
    <mask id="subWipe">
      <rect class="wipe" x="60" y="160" width="900" height="32" fill="#ffffff"/>
    </mask>
  </defs>
  <style>
    .serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif; }
    .sans  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .kicker { font-size: 19px; font-weight: 600; letter-spacing: 6px; fill: #8fa8d8; }
    .name   { font-size: 62px; font-weight: 700; fill: #ede8de; }
    .sub    { font-size: 20px; font-weight: 600; letter-spacing: 4.5px; fill: #b8c6e4; }
    .book   { font-size: 22px; font-style: italic; fill: #cfc7b4; }
    .cap    { font-size: 13px; font-weight: 700; letter-spacing: 3px; }

    @keyframes rise    { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes riseUp  { from { opacity: 0; transform: translateY(10px); }  to { opacity: 1; transform: translateY(0); } }
    @keyframes wipeIn  { 0% { width: 0; } 100% { width: 900px; } }
    @keyframes glint   { 0%,100% { opacity: 0; } 5% { opacity: 0; } 10% { opacity: 0.45; } 16% { opacity: 0; } }
    @keyframes flow    { 0% { transform: translateX(0); } 100% { transform: translateX(-1244px); } }
    @keyframes twinkle { 0%,100% { opacity: 0.08; } 50% { opacity: 0.75; } }
    @keyframes breathe { 0%,100% { opacity: 0.35; } 50% { opacity: 0.65; } }
    @keyframes ripple  { 0%,12%,100% { opacity: 0; } 6% { opacity: 0.26; } }

    .in-kicker { animation: rise   0.8s ease-out both 0.10s; }
    .in-name   { animation: rise   0.9s ease-out both 0.25s; }
    .in-book   { animation: riseUp 0.8s ease-out both 1.30s; }
    .in-caps   { animation: riseUp 0.8s ease-out both 1.60s; }
    .wipe      { animation: wipeIn 1.4s cubic-bezier(.65,0,.35,1) both 0.9s; }
    .glint     { animation: glint  7s ease-in-out infinite 2.2s; }
    .flowBar   { animation: flow   10s linear infinite; }
    .tw        { animation: twinkle 5s ease-in-out infinite; }
    .glowPulse { animation: breathe 8s ease-in-out infinite; }
    .bar       { animation: rise 0.6s ease-out both; }
    .rip       { animation: ripple 9s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1280" height="300" rx="18" fill="url(#glow)"/>
  <rect width="1280" height="300" rx="18" fill="url(#hex)"/>

  <!-- twinkling points, scattered in the quiet areas -->
  <g fill="#9db8e8">
    <circle class="tw" cx="845" cy="62"  r="1.6" opacity="0.3" style="animation-delay:-1s"/>
    <circle class="tw" cx="905" cy="188" r="1.3" opacity="0.3" style="animation-delay:-2.4s"/>
    <circle class="tw" cx="790" cy="248" r="1.8" opacity="0.3" style="animation-delay:-3.7s;animation-duration:6s"/>
    <circle class="tw" cx="960" cy="92"  r="1.2" opacity="0.3" style="animation-delay:-0.6s;animation-duration:4.4s"/>
    <circle class="tw" cx="730" cy="120" r="1.4" opacity="0.3" style="animation-delay:-4.9s;animation-duration:6.4s"/>
    <circle class="tw" cx="985" cy="232" r="1.5" opacity="0.3" style="animation-delay:-2s;animation-duration:5.6s"/>
    <circle class="tw" cx="662" cy="60"  r="1.2" opacity="0.3" style="animation-delay:-3.2s"/>
    <circle class="tw" cx="872" cy="282" r="1.2" opacity="0.3" style="animation-delay:-1.8s;animation-duration:4.8s"/>
    <circle class="tw" cx="1246" cy="32" r="1.4" opacity="0.3" style="animation-delay:-4.2s;animation-duration:5.2s"/>
  </g>

  <!-- left: identity -->
  <g class="in-kicker">
    <rect x="64" y="52" width="46" height="5" rx="2.5" fill="url(#rainbow)"/>
    <text class="sans kicker" x="126" y="62">SOFTWARE ARCHITECT &#183; AUTHOR</text>
  </g>
  <g class="in-name">
    <text class="serif name" x="62" y="137">Anup Hariharan Nair</text>
    <!-- white clone flares briefly: a glint over the glyphs -->
    <text class="serif glint" x="62" y="137" font-size="62" font-weight="700" fill="#ffffff" opacity="0">Anup Hariharan Nair</text>
  </g>
  <g mask="url(#subWipe)">
    <text class="sans sub" x="64" y="182">DISTRIBUTED SYSTEMS &#183; PERFORMANCE &#183; RELIABILITY</text>
  </g>
  <g class="in-book">
    <rect x="64" y="208" width="4" height="34" rx="2" fill="url(#vbar)"/>
    <text class="serif book" x="82" y="231">Author of&#160;&#160;Layered Volatility Decomposition</text>
  </g>

  <!-- right: eight-layer motif, volatile (red, top) to stable (blue, bottom) -->
  <ellipse class="glowPulse" cx="1112" cy="150" rx="150" ry="120" fill="#16325f" opacity="0.5" filter="url(#soft)"/>
  <g>
    <g class="in-caps"><text class="sans cap" x="1208" y="56" text-anchor="end" fill="#ef7a7d">VOLATILE</text></g>
    <g>
      <g class="bar" style="animation-delay:0.30s"><rect x="1016" y="66"  width="192" height="17" rx="5" fill="#6e1c22" stroke="#ef4b4f" stroke-opacity="0.85"/><rect class="rip" style="animation-delay:2.0s" x="1016" y="66" width="192" height="17" rx="5" fill="#ffffff" opacity="0"/></g>
      <g class="bar" style="animation-delay:0.42s"><rect x="1026" y="87"  width="182" height="17" rx="5" fill="#5e3214" stroke="#e08a3a" stroke-opacity="0.8"/><rect class="rip" style="animation-delay:2.35s" x="1026" y="87" width="182" height="17" rx="5" fill="#ffffff" opacity="0"/></g>
      <g class="bar" style="animation-delay:0.54s"><rect x="1036" y="108" width="172" height="17" rx="5" fill="#4e4310" stroke="#c4b13a" stroke-opacity="0.75"/><rect class="rip" style="animation-delay:2.7s" x="1036" y="108" width="172" height="17" rx="5" fill="#ffffff" opacity="0"/></g>
      <g class="bar" style="animation-delay:0.66s"><rect x="1046" y="129" width="162" height="17" rx="5" fill="#094330" stroke="#3fb868" stroke-opacity="0.7"/><rect class="rip" style="animation-delay:3.05s" x="1046" y="129" width="162" height="17" rx="5" fill="#ffffff" opacity="0"/></g>
      <g class="bar" style="animation-delay:0.78s"><rect x="1056" y="150" width="152" height="17" rx="5" fill="#053b41" stroke="#26b5a0" stroke-opacity="0.65"/><rect class="rip" style="animation-delay:3.4s" x="1056" y="150" width="152" height="17" rx="5" fill="#ffffff" opacity="0"/></g>
      <g class="bar" style="animation-delay:0.90s"><rect x="1066" y="171" width="142" height="17" rx="5" fill="#0b3a5d" stroke="#2fa0c9" stroke-opacity="0.6"/><rect class="rip" style="animation-delay:3.75s" x="1066" y="171" width="142" height="17" rx="5" fill="#ffffff" opacity="0"/></g>
      <g class="bar" style="animation-delay:1.02s"><rect x="1076" y="192" width="132" height="17" rx="5" fill="#0d3160" stroke="#3b8bde" stroke-opacity="0.55"/><rect class="rip" style="animation-delay:4.1s" x="1076" y="192" width="132" height="17" rx="5" fill="#ffffff" opacity="0"/></g>
      <g class="bar" style="animation-delay:1.14s"><rect x="1086" y="213" width="122" height="17" rx="5" fill="#0b2a55" stroke="#3a6fd8" stroke-opacity="0.5"/><rect class="rip" style="animation-delay:4.45s" x="1086" y="213" width="122" height="17" rx="5" fill="#ffffff" opacity="0"/></g>
      <rect x="1016" y="66" width="192" height="17" rx="5" fill="url(#sheen)"/>
    </g>
    <g class="in-caps"><text class="sans cap" x="1208" y="252" text-anchor="end" fill="#6f9bd8">STABLE</text></g>
  </g>

  <!-- flowing rainbow rule -->
  <g clip-path="url(#ruleClip)">
    <rect class="flowBar" x="18" y="292" width="2488" height="4" fill="url(#rainbowFlow)"/>
  </g>
</svg>
