<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 36" width="1280" height="36" role="img">
  <title>Volatility meter</title>
  <desc>Decorative divider: a meter sweeping the volatility range from 0.3 to 1.0.</desc>
  <defs>
    <linearGradient id="meter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a6fd8"/><stop offset="0.4" stop-color="#3fb868"/>
      <stop offset="0.75" stop-color="#e08a3a"/><stop offset="1" stop-color="#ef4b4f"/>
    </linearGradient>
    <clipPath id="track"><rect x="150" y="14" width="980" height="8" rx="4"/></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 15px; font-weight: 700; letter-spacing: 2px; }
    @keyframes fill { 0% { width: 294px; } 45% { width: 980px; } 55% { width: 980px; } 100% { width: 294px; } }
    .fill { animation: fill 11s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="1280" height="36" rx="10" fill="#071022"/>
  <text class="sans" x="128" y="25" text-anchor="end" fill="#8fa8d8">&#957; 0.3</text>
  <rect x="150" y="14" width="980" height="8" rx="4" fill="#132442"/>
  <g clip-path="url(#track)">
    <rect class="fill" x="150" y="14" width="980" height="8" fill="url(#meter)"/>
  </g>
  <text class="sans" x="1152" y="25" fill="#ef7a7d">1.0</text>
</svg>
